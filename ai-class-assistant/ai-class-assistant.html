<div id="root"></div>
<script type="text/babel">
const { useState, useCallback, useRef, useEffect } = React;

// ============================================================
// 定数・プリセット
// ============================================================
const SCHOOL_PRESETS = {
    elementary: { schoolType:'elementary', label:'小学校', description:'3段階または5段階の学力評価、運動能力フラグ、通学班対応', defaultAcademicInput:'scale_3', defaultPhysicalInput:'flag', defaultNumClasses:4, defaultWeights:{ genderBalance:10, academicBalance:8, physicalBalance:5, careBalance:7, pianoDistribution:8, leaderDistribution:4, absenceDistribution:6, formerClassMix:6, specialSupportBalance:7, classSizeBalance:8 }, sampleSubjects:['国語','算数','理科','社会'] },
    middle: { schoolType:'middle', label:'中学校', description:'5段階または100点満点の学力評価、5教科対応', defaultAcademicInput:'scale_5', defaultPhysicalInput:'scale_5', defaultNumClasses:5, defaultWeights:{ genderBalance:10, academicBalance:10, physicalBalance:5, careBalance:8, pianoDistribution:6, leaderDistribution:4, absenceDistribution:6, formerClassMix:5, specialSupportBalance:8, classSizeBalance:8 }, sampleSubjects:['国語','数学','英語','理科','社会'] },
    high: { schoolType:'high', label:'高校', description:'偏差値または5教科合計、コース・選択科目対応', defaultAcademicInput:'deviation', defaultPhysicalInput:'grade_AE', defaultNumClasses:6, defaultWeights:{ genderBalance:8, academicBalance:9, physicalBalance:5, careBalance:7, pianoDistribution:3, leaderDistribution:4, absenceDistribution:6, formerClassMix:4, specialSupportBalance:7, classSizeBalance:8 }, sampleSubjects:['国語','数学','英語','理科','社会'] },
};
const DEFAULT_GA_CONFIG = { populationSize:60, generations:350, eliteCount:14, mutationRate:0.05, numPlans:5 };
const CLASS_COLORS = ['#2563eb','#059669','#d97706','#dc2626','#7c3aed','#db2777','#0891b2','#65a30d'];
const CARE_COLORS = { learning:'#2563eb', behavior:'#d97706', relationship:'#dc2626', family:'#7c3aed', health:'#059669' };
const CARE_CATEGORY_LABELS = { learning:'学習支援', behavior:'生活指導', relationship:'人間関係', family:'家庭環境', health:'健康・心理' };
const SCHOOL_LABELS = { elementary:'小学校', middle:'中学校', high:'高校' };
const SCHOOL_ICONS = { elementary:'🏫', middle:'🏫', high:'🎓' };
const SCHOOL_COUNTS = { elementary:'4クラス / 108名', middle:'5クラス / 150名', high:'6クラス / 180名' };
const ACADEMIC_TYPE_LABELS = { scale_3:'3段階（◎○△）', scale_5:'5段階（1〜5）', points_100:'100点満点', points_500:'5教科合計（500点）', deviation:'偏差値', custom:'カスタム' };
const PHYSICAL_TYPE_LABELS = { numeric:'数値（体力テスト）', grade_AE:'段階評価（A〜E）', scale_5:'5段階（1〜5）', flag:'フラグ（○印）' };

// ============================================================
// ユーティリティ
// ============================================================
class SeededRandom { constructor(s){this.seed=s;} next(){this.seed=(this.seed*1664525+1013904223)&0xffffffff;return(this.seed>>>0)/0xffffffff;} nextInt(a,b){return Math.floor(this.next()*(b-a+1))+a;} pick(a){return a[Math.floor(this.next()*a.length)];} bool(p=0.5){return this.next()<p;} }

function generateSampleStudents(schoolType, count=108, seed=42) {
    const rng = new SeededRandom(seed);
    const ln=['田中','鈴木','佐藤','高橋','渡辺','伊藤','山本','中村','小林','加藤','吉田','山田','佐々木','山口','松本','井上','木村','林','斎藤','清水'];
    const fm=['蓮','陽翔','湊','蒼','陸','樹','悠斗','大翔','翔','一輝','颯太','優斗','健太','拓海','海斗'];
    const ff=['葵','陽菜','凛','結衣','桜','美咲','愛','心春','七海','詩','杏','柚希','さくら','彩花','優奈'];
    const students = [];
    for (let i=0;i<count;i++) {
        const gender = rng.bool(0.5)?'male':'female';
        const name = rng.pick(ln)+(gender==='male'?rng.pick(fm):rng.pick(ff));
        let currentClass, academicRaw, physicalRaw, careCategories;
        if (schoolType==='elementary') { currentClass=rng.nextInt(1,4); academicRaw=rng.pick(['◎','○','△']); physicalRaw=rng.bool(0.3)?'○':undefined; }
        else if (schoolType==='middle') { currentClass=rng.nextInt(1,5); academicRaw=rng.nextInt(1,5); physicalRaw=rng.nextInt(1,5); }
        else { currentClass=rng.nextInt(1,6); academicRaw=Math.min(70,Math.max(35,Math.round(50+(rng.next()-0.5)*30))); physicalRaw=rng.pick(['A','B','C','D','E']); }
        if (rng.bool(0.15)) { careCategories={}; const cat=rng.pick(['learning','behavior','relationship','family','health']); careCategories[cat]=rng.bool(0.5)?1:rng.bool(0.7)?2:3; }
        students.push({ id:`S${String(i+1).padStart(4,'0')}`, name, gender, currentClass, academicRaw, physicalRaw, canPlayPiano:rng.bool(0.12), isLeader:rng.bool(0.10), hasSpecialSupport:rng.bool(0.04), hasTendencyAbsence:rng.bool(0.05), careCategories });
    }
    return students;
}

function normalizeScale3(v){const s=String(v).trim();if(s==='◎'||s==='3')return 100;if(s==='○'||s==='2')return 50;if(s==='△'||s==='1')return 0;return 50;}
function normalizeScale5(v){const n=parseFloat(String(v));if(isNaN(n))return 50;return Math.max(0,Math.min(100,((n-1)/4)*100));}
function normalizePoints100(v){const n=parseFloat(String(v));if(isNaN(n))return 50;return Math.max(0,Math.min(100,n));}
function normalizePoints500(v){const n=parseFloat(String(v));if(isNaN(n))return 50;return Math.max(0,Math.min(100,(n/500)*100));}
function normalizeDeviation(v){const n=parseFloat(String(v));if(isNaN(n))return 50;return Math.max(0,Math.min(100,((n-25)/50)*100));}
function normalizeGradeAE(v){const s=String(v).trim().toUpperCase();return{A:100,B:75,C:50,D:25,E:0}[s]??50;}
function normalizeFlagVal(v){const s=String(v??'').trim();return(s==='○'||s==='◯'||s==='〇'||s==='◎'||s==='●'||s==='✓'||s==='✔'||v===1||v===true)?100:0;}
function normalizeAcademic(v,t){if(v===undefined||v===null||v==='')return 50;switch(t){case'scale_3':return normalizeScale3(v);case'scale_5':return normalizeScale5(v);case'points_100':return normalizePoints100(v);case'points_500':return normalizePoints500(v);case'deviation':return normalizeDeviation(v);default:return normalizeScale5(v);}}
function normalizePhysical(v,t){if(v===undefined||v===null||v==='')return 50;switch(t){case'grade_AE':return normalizeGradeAE(v);case'scale_5':return normalizeScale5(v);case'flag':return normalizeFlagVal(v);case'numeric':return normalizePoints100(v);default:return normalizeScale5(v);}}
function calcTotalCarePoints(s){if(s.careCategories)return Object.values(s.careCategories).reduce((a,b)=>a+b,0);if(s.careFlag)return 2;return 0;}
function normalizeStudents(students,at,pt){return students.map(s=>({...s,normalizedAcademic:normalizeAcademic(s.academicRaw,at),normalizedPhysical:normalizePhysical(s.physicalRaw,pt),totalCarePoints:calcTotalCarePoints(s)}));}

function calcClassStats(cls) {
    const st=cls.students,total=st.length;
    if(!total)return{classNumber:cls.classNumber,total:0,maleCount:0,femaleCount:0,maleRatio:0,avgAcademic:0,avgPhysical:0,pianoCount:0,leaderCount:0,specialSupportCount:0,absenceTendencyCount:0,totalCarePoints:0,categoryBreakdown:{},formerClasses:{}};
    const mc=st.filter(s=>s.gender==='male').length,fc=total-mc;
    const aa=st.reduce((a,s)=>a+(s.normalizedAcademic??50),0)/total;
    const ap=st.reduce((a,s)=>a+(s.normalizedPhysical??50),0)/total;
    const cats=['learning','behavior','relationship','family','health'];
    const cb={};cats.forEach(cat=>{let c=0,sv=0;st.forEach(s=>{const l=s.careCategories?.[cat];if(l){c++;if(l>=3)sv++;}});if(c)cb[cat]={count:c,severe:sv};});
    const fcs={};st.forEach(s=>{if(!fcs[s.currentClass])fcs[s.currentClass]={total:0,male:0,female:0};fcs[s.currentClass].total++;if(s.gender==='male')fcs[s.currentClass].male++;else fcs[s.currentClass].female++;});
    return{classNumber:cls.classNumber,total,maleCount:mc,femaleCount:fc,maleRatio:mc/total,avgAcademic:Math.round(aa*10)/10,avgPhysical:Math.round(ap*10)/10,pianoCount:st.filter(s=>s.canPlayPiano).length,leaderCount:st.filter(s=>s.isLeader).length,specialSupportCount:st.filter(s=>s.hasSpecialSupport).length,absenceTendencyCount:st.filter(s=>s.hasTendencyAbsence).length,totalCarePoints:st.reduce((a,s)=>a+(s.totalCarePoints??0),0),categoryBreakdown:cb,formerClasses:fcs};
}

// スコアリング
function calcClassMetrics(cls){const st=cls.students,t=st.length;if(!t)return{maleRatio:.5,avgAcademic:50,avgPhysical:50,pianoCount:0,leaderCount:0,specialSupportCount:0,absenceCount:0,totalCarePoints:0,careByCategory:{},formerClasses:new Set()};const mc=st.filter(s=>s.gender==='male').length;const cbc={};['learning','behavior','relationship','family','health'].forEach(cat=>{let c=0,sc=0;st.forEach(s=>{const l=s.careCategories?.[cat];if(l){c++;if(l>=3)sc++;}});if(c)cbc[cat]={count:c,severeCount:sc};});return{maleRatio:mc/t,avgAcademic:st.reduce((a,s)=>a+(s.normalizedAcademic??50),0)/t,avgPhysical:st.reduce((a,s)=>a+(s.normalizedPhysical??50),0)/t,pianoCount:st.filter(s=>s.canPlayPiano).length,leaderCount:st.filter(s=>s.isLeader).length,specialSupportCount:st.filter(s=>s.hasSpecialSupport).length,absenceCount:st.filter(s=>s.hasTendencyAbsence).length,totalCarePoints:st.reduce((a,s)=>a+(s.totalCarePoints??0),0),careByCategory:cbc,formerClasses:new Set(st.map(s=>s.currentClass))};}

function scoreAssignment(classes,allStudents,weights,constraints){
    const B=10000;let p=0;const nc=classes.length,ts=allStudents.length;
    const gmc=allStudents.filter(s=>s.gender==='male').length,gfc=ts-gmc,gmr=gmc/ts;
    const gaa=allStudents.reduce((a,s)=>a+(s.normalizedAcademic??50),0)/ts;
    const gap=allStudents.reduce((a,s)=>a+(s.normalizedPhysical??50),0)/ts;
    const gac=allStudents.reduce((a,s)=>a+(s.totalCarePoints??0),0)/ts;
    const gsp=allStudents.filter(s=>s.hasSpecialSupport).length/nc;
    const gl=allStudents.filter(s=>s.isLeader).length/nc;
    const ga=allStudents.filter(s=>s.hasTendencyAbsence).length/nc;
    const imn=Math.floor(gmc/nc),imx=Math.ceil(gmc/nc),ifn=Math.floor(gfc/nc),ifx=Math.ceil(gfc/nc);
    const metrics=classes.map(c=>calcClassMetrics(c));
    for(let ci=0;ci<metrics.length;ci++){const m=metrics[ci];
        if(weights.genderBalance>=15){const cm=classes[ci].students.filter(s=>s.gender==='male').length,cf=classes[ci].students.length-cm;p+=(Math.max(0,cm-imx)+Math.max(0,imn-cm)+Math.max(0,cf-ifx)+Math.max(0,ifn-cf))*2000;}
        else p+=Math.abs(m.maleRatio-gmr)*weights.genderBalance*20;
        p+=Math.abs(m.avgAcademic-gaa)*weights.academicBalance*.5;p+=Math.abs(m.avgPhysical-gap)*weights.physicalBalance*.5;
        p+=Math.abs(m.specialSupportCount-gsp)*weights.specialSupportBalance*15;p+=Math.abs(m.leaderCount-gl)*weights.leaderDistribution*10;
        p+=Math.abs(m.absenceCount-ga)*weights.absenceDistribution*15;p+=Math.abs(m.totalCarePoints/Math.max(classes[0].students.length,1)-gac)*weights.careBalance*10;
    }
    const cs=classes.map(c=>c.students.length),isn=Math.floor(ts/nc),isx=Math.ceil(ts/nc);
    if(weights.classSizeBalance>=15){for(const sz of cs)p+=(Math.max(0,sz-isx)+Math.max(0,isn-sz))*2000;}
    else{const avg=ts/nc;p+=cs.reduce((a,n)=>a+Math.pow(n-avg,2),0)/nc*weights.classSizeBalance*.5;}
    const afc=Array.from(new Set(allStudents.map(s=>s.currentClass)));
    const fcTotal=classes.map(c=>{const m=new Map();c.students.forEach(s=>m.set(s.currentClass,(m.get(s.currentClass)??0)+1));return m;});
    const fcMaleMap=classes.map(c=>{const m=new Map();c.students.filter(s=>s.gender==='male').forEach(s=>m.set(s.currentClass,(m.get(s.currentClass)??0)+1));return m;});
    const fcFemaleMap=classes.map(c=>{const m=new Map();c.students.filter(s=>s.gender==='female').forEach(s=>m.set(s.currentClass,(m.get(s.currentClass)??0)+1));return m;});
    for(const fc of afc){
        const cnt=fcTotal.map(m=>m.get(fc)??0);const av=cnt.reduce((a,b)=>a+b,0)/nc;
        p+=cnt.reduce((a,c)=>a+Math.pow(c-av,2),0)/nc*weights.formerClassMix*2;
        const mcnt=fcMaleMap.map(m=>m.get(fc)??0);const mav=mcnt.reduce((a,b)=>a+b,0)/nc;
        if(mav>0){p+=mcnt.reduce((a,c)=>a+Math.pow(c-mav,2),0)/nc*weights.formerClassMix*3;mcnt.forEach(c=>{if(mav>=1&&c===0)p+=weights.formerClassMix*25;});}
        const fmcnt=fcFemaleMap.map(m=>m.get(fc)??0);const fav=fmcnt.reduce((a,b)=>a+b,0)/nc;
        if(fav>0){p+=fmcnt.reduce((a,c)=>a+Math.pow(c-fav,2),0)/nc*weights.formerClassMix*3;fmcnt.forEach(c=>{if(fav>=1&&c===0)p+=weights.formerClassMix*25;});}
    }
    const ppc=metrics.map(m=>m.pianoCount);p+=ppc.filter(c=>c===0).length*weights.pianoDistribution*50;
    const pavg=ppc.reduce((a,b)=>a+b,0)/nc;p+=ppc.reduce((a,c)=>a+Math.pow(c-pavg,2),0)/nc*weights.pianoDistribution*5;
    ['learning','behavior','relationship','family','health'].forEach(cat=>{metrics.forEach(m=>{const sc=m.careByCategory[cat]?.severeCount??0;if(sc>=2)p+=(sc-1)*weights.careBalance*80;});});
    const scm=new Map();classes.forEach(c=>c.students.forEach(s=>scm.set(s.id,c.classNumber)));
    for(const cn of constraints){const ca=scm.get(cn.studentA),cb2=scm.get(cn.studentB);if(ca===undefined||cb2===undefined)continue;const same=ca===cb2;if(cn.type==='ng'&&same)p+=cn.priority==='required'?500:100;if(cn.type==='ok'&&!same)p+=cn.priority==='required'?120:40;}
    return Math.max(0,B-p);
}

function getViolatedConstraints(classes,constraints){const m=new Map();classes.forEach(c=>c.students.forEach(s=>m.set(s.id,c.classNumber)));return constraints.filter(cn=>{const a=m.get(cn.studentA),b=m.get(cn.studentB);if(a===undefined||b===undefined)return false;return(cn.type==='ng'&&a===b)||(cn.type==='ok'&&a!==b);});}

// GA
function chromosomeToClasses(ch,st,nc){const cl=Array.from({length:nc},(_,i)=>({classNumber:i+1,students:[]}));for(let i=0;i<st.length;i++)cl[ch[i]].students.push(st[i]);return cl;}
function createRandomChromosome(st,nc){const ch=new Array(st.length).fill(0);const ml=st.map((s,i)=>({s,i})).filter(x=>x.s.gender==='male');const fl=st.map((s,i)=>({s,i})).filter(x=>x.s.gender==='female');[...ml].sort(()=>Math.random()-.5).forEach((m,i)=>{ch[m.i]=i%nc;});[...fl].sort(()=>Math.random()-.5).forEach((f,i)=>{ch[f.i]=i%nc;});return ch;}
function crossover(p1,p2){return p1.map((g,i)=>Math.random()<.5?g:p2[i]);}
function mutate(ch,nc){const m=[...ch];const i1=Math.floor(Math.random()*m.length);let i2=Math.floor(Math.random()*m.length);while(i2===i1)i2=Math.floor(Math.random()*m.length);[m[i1],m[i2]]=[m[i2],m[i1]];return m;}

function repairClassSizes(ch,students,nc){const r=[...ch];const iMin=Math.floor(students.length/nc),iMax=Math.ceil(students.length/nc);const ci=Array.from({length:nc},()=>[]);for(let i=0;i<r.length;i++)ci[r[i]].push(i);for(let it=0;it<200;it++){let moved=false;for(let f=0;f<nc;f++){while(ci[f].length>iMax){const t=ci.findIndex((c,i2)=>i2!==f&&c.length<iMin);if(t===-1)break;const si=ci[f].pop();ci[t].push(si);r[si]=t;moved=true;}}if(!moved)break;}return r;}

function repairGenderBalance(ch,students,nc){const r=[...ch];const mt=students.filter(s=>s.gender==='male').length,ft=students.length-mt;const imn=Math.floor(mt/nc),imx=Math.ceil(mt/nc),ifn=Math.floor(ft/nc),ifx=Math.ceil(ft/nc);const cm=Array.from({length:nc},()=>[]),cf=Array.from({length:nc},()=>[]);for(let i=0;i<r.length;i++){if(students[i].gender==='male')cm[r[i]].push(i);else cf[r[i]].push(i);}for(let it=0;it<300;it++){let sw=false;for(let f=0;f<nc;f++){if(cm[f].length>imx&&cf[f].length<ifx){const t=cm.findIndex((m,i2)=>i2!==f&&m.length<imn&&cf[i2].length>ifn);if(t===-1)continue;const mi=cm[f].pop(),fi=cf[t].pop();r[mi]=t;r[fi]=f;cm[t].push(mi);cf[f].push(fi);sw=true;}}if(!sw)break;}return r;}

async function optimizeClassAssignment(students,config,onProgress){
    const{numClasses:nc,weights,constraints,populationSize:ps,generations:gen,eliteCount:ec,numPlans:np}=config;
    let pop=Array.from({length:ps},()=>createRandomChromosome(students,nc));
    const ev=ch=>{const cl=chromosomeToClasses(ch,students,nc);return scoreAssignment(cl,students,weights,constraints);};
    let scores=pop.map(ev);
    const tp=(p,s)=>()=>{const ts=5;let b=Math.floor(Math.random()*p.length);for(let t=1;t<ts;t++){const c=Math.floor(Math.random()*p.length);if(s[c]>s[b])b=c;}return p[b];};
    const ep=[];
    for(let g=0;g<gen;g++){
        if(g%10===0){onProgress?.(g/gen);await new Promise(r=>setTimeout(r,0));}
        const ranked=scores.map((s,i)=>({s,i})).sort((a,b)=>b.s-a.s);
        for(let k=0;k<Math.min(3,ec);k++)ep.push({chromosome:pop[ranked[k].i],score:ranked[k].s});
        const elites=ranked.slice(0,ec).map(r=>pop[r.i]);const next=[...elites];const pick=tp(pop,scores);
        while(next.length<ps){let child=crossover(pick(),pick());if(Math.random()<(config.mutationRate??.05)*10)child=mutate(child,nc);next.push(child);}
        pop=next.slice(0,ps);scores=pop.map(ev);
    }
    onProgress?.(1);
    const uq=ep.sort((a,b)=>b.score-a.score).slice(0,np*10);const sel=[];
    for(const plan of uq){if(sel.length>=np)break;if(!sel.length){sel.push(plan);continue;}const div=sel.every(s=>{let d=0;for(let i=0;i<plan.chromosome.length;i++)if(plan.chromosome[i]!==s.chromosome[i])d++;return d/plan.chromosome.length>.1;});if(div)sel.push(plan);}
    const fp=pop.map((c,i)=>({chromosome:c,score:scores[i]})).sort((a,b)=>b.score-a.score);for(const p of fp){if(sel.length>=np)break;sel.push(p);}
    const now=new Date();
    return sel.slice(0,np).map((p,pi)=>{
        let ch=p.chromosome;if(weights.classSizeBalance>=15)ch=repairClassSizes(ch,students,nc);if(weights.genderBalance>=15)ch=repairGenderBalance(ch,students,nc);
        const cl=chromosomeToClasses(ch,students,nc);const stats=cl.map(c=>calcClassStats(c));const vio=getViolatedConstraints(cl,constraints);
        return{id:`plan_${pi+1}`,score:p.score,classes:cl,stats,violatedConstraints:vio,generatedAt:now};
    });
}

// Excel読み込み - あいまい列名マッチング + 表記自動推定
const FUZZY_COLUMN_RULES=[
    {field:'name',keywords:['氏名','名前','生徒名','児童名','フルネーム','姓名','名称']},
    {field:'gender',keywords:['性別','男女','sex']},
    {field:'currentClass',keywords:['現クラス','前クラス','旧クラス','クラス','組','学級','現在の組','現組','所属']},
    {field:'assignedClass',keywords:['編成クラス','新クラス','新組','配属クラス','配属先','新しい組']},
    {field:'academicRaw',keywords:['学力','総合学力','成績','学力評価','成績評定','総合評定','総合成績','学力総合','評定平均','評定']},
    {field:'subject_国語',keywords:['国語']},
    {field:'subject_算数',keywords:['算数']},
    {field:'subject_数学',keywords:['数学']},
    {field:'subject_英語',keywords:['英語']},

function fuzzyMatchColumn(header) {
    const h = header.trim();
    for (const rule of FUZZY_COLUMN_RULES) {
        if (rule.keywords.includes(h)) return rule.field;
    }
    for (const rule of FUZZY_COLUMN_RULES) {
        for (const kw of rule.keywords) {
            if (h.includes(kw) || kw.includes(h)) return rule.field;
        }
    }
    return null;
}

function normalizeFlagBool(v) {
    if (v === undefined || v === null || v === '') return false;
    const s = String(v).trim();
    return s==='○'||s==='◯'||s==='〇'||s==='◎'||s==='●'||s==='✓'||s==='✔'||s==='true'||s==='TRUE'||s==='1'||s==='有'||s==='あり'||s==='該当'||s==='Yes'||s==='yes'||s==='Y'||s==='y'||s==='丸'||s==='マル'||v===true||v===1;
}

function inferAcademicTypeFromValues(values) {
    if (!values.length) return null;
    const strs = values.map(v => String(v).trim());
    if (strs.some(v => ['◎','○','△','×'].includes(v))) return 'scale_3';
    if (strs.some(v => ['A','B','C','D','E'].includes(v.toUpperCase()))) return 'scale_5';
    const nums = strs.map(v => parseFloat(v)).filter(n => !isNaN(n));
    if (!nums.length) return null;
    const maxVal = Math.max(...nums);
    const minVal = Math.min(...nums);
    if (maxVal > 100) return 'points_500';
    if (maxVal > 10) {
        if (maxVal <= 80 && minVal >= 20) return 'deviation';
        return 'points_100';
    }
    if (maxVal <= 3) return 'scale_3';
    if (maxVal <= 5) return 'scale_5';
    return null;
}

function inferPhysicalTypeFromValues(values) {
    if (!values.length) return null;
    const strs = values.map(v => String(v).trim());
    if (strs.some(v => ['A','B','C','D','E'].includes(v.toUpperCase()))) return 'grade_AE';
    if (strs.some(v => ['○','◯','◎'].includes(v)) && strs.some(v => v === '' || v === undefined)) return 'flag';
    const nums = strs.map(v => parseFloat(v)).filter(n => !isNaN(n));
    if (!nums.length) return null;
    const maxVal = Math.max(...nums);
    if (maxVal <= 5) return 'scale_5';
    return 'numeric';
}

function parseExcelData(data, config) {
    if (data.length < 2) return { students: [], unknownColumns: [], inferredAcademicType: null, inferredPhysicalType: null };
    const headers = data[0].map(h => String(h ?? '').trim());
    const rows = data.slice(1);
    const fm = {};
    const uc = [];
    headers.forEach((h, i) => {
        if (!h) return;
        const matched = fuzzyMatchColumn(h);
        if (matched) fm[i] = matched;
        else uc.push(h);
    });

    const acVals = [], phVals = [];
    const acIdx = Object.entries(fm).find(([,f]) => f === 'academicRaw')?.[0];
    const phIdx = Object.entries(fm).find(([,f]) => f === 'physicalRaw')?.[0];
    const subIdxs = Object.entries(fm).filter(([,f]) => f.startsWith('subject_')).map(([i]) => parseInt(i));
    rows.slice(0, 50).forEach(row => {
        if (acIdx !== undefined) { const v = row[parseInt(acIdx)]; if (v !== undefined && v !== null && v !== '') acVals.push(v); }
        subIdxs.forEach(si => { const v = row[si]; if (v !== undefined && v !== null && v !== '') acVals.push(v); });
        if (phIdx !== undefined) { const v = row[parseInt(phIdx)]; if (v !== undefined && v !== null && v !== '') phVals.push(v); }
    });
    const inferredAT = inferAcademicTypeFromValues(acVals);
    const inferredPT = inferPhysicalTypeFromValues(phVals);
    const useAT = inferredAT || config.academicInputType;
    const usePT = inferredPT || config.physicalInputType;

    const students = rows.filter(r => r.some(c => c !== undefined && c !== null && c !== '')).map((row, ri) => {
        const s = { id: `S${String(ri + 1).padStart(4, '0')}`, academicSubjects: {}, careCategories: {} };
        for (const [is, field] of Object.entries(fm)) {
            const v = row[parseInt(is)];
            if (v === undefined || v === null || v === '') continue;
            if (field === 'name') s.name = String(v);
            else if (field === 'gender') { const gs = String(v).trim(); s.gender = ['男','男性','M','male','1','♂'].includes(gs) ? 'male' : 'female'; }
            else if (field === 'currentClass') s.currentClass = parseInt(String(v)) || 1;
            else if (field === 'assignedClass') { const ac = parseInt(String(v)); if (ac >= 1) s.assignedClass = ac; }
            else if (field === 'academicRaw') s.academicRaw = v;
            else if (field === 'physicalRaw') s.physicalRaw = v;
            else if (field === 'canPlayPiano') s.canPlayPiano = normalizeFlagBool(v);
            else if (field === 'isLeader') s.isLeader = normalizeFlagBool(v);
            else if (field === 'hasSpecialSupport') s.hasSpecialSupport = normalizeFlagBool(v);
            else if (field === 'hasTendencyAbsence') s.hasTendencyAbsence = normalizeFlagBool(v);
            else if (field === 'careFlag') s.careFlag = normalizeFlagBool(v);
            else if (field === 'behavior') { s.careFlag = normalizeFlagBool(v); if (!s.careCategories) s.careCategories = {}; if (normalizeFlagBool(v)) s.careCategories.behavior = 2; }
            else if (field === 'selectedSubject') s.selectedSubject = String(v);
            else if (field === 'course') s.course = String(v);
            else if (field === 'commutingGroup') s.commutingGroup = String(v);
            else if (field === 'note') s.note = String(v);
            else if (field.startsWith('subject_')) s.academicSubjects[field.replace('subject_', '')] = v;
            else if (field.startsWith('care_')) {
                const cn = field.replace('care_', '');
                const nv = parseInt(String(v));
                if (nv >= 1 && nv <= 3) { if (!s.careCategories) s.careCategories = {}; s.careCategories[cn] = nv; }
                else if (normalizeFlagBool(v)) { if (!s.careCategories) s.careCategories = {}; s.careCategories[cn] = 2; }
            }
        }
        if (!s.name) s.name = `生徒${ri + 1}`;
        if (!s.gender) s.gender = 'male';
        if (!s.currentClass) s.currentClass = 1;
        if (!Object.keys(s.academicSubjects).length) delete s.academicSubjects;
        if (!Object.keys(s.careCategories).length) delete s.careCategories;
        return s;
    });
    return { students: normalizeStudents(students, useAT, usePT), unknownColumns: uc, inferredAcademicType: inferredAT, inferredPhysicalType: inferredPT };
}
function readExcelFile(file,config){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=e=>{try{const d=new Uint8Array(e.target.result);const wb=XLSX.read(d,{type:'array'});const sn=wb.SheetNames.find(n=>n==='全児童データ')??wb.SheetNames.find(n=>n.includes('名簿')||n.includes('生徒')||n.includes('児童'))??wb.SheetNames[0];const ws=wb.Sheets[sn];const jd=XLSX.utils.sheet_to_json(ws,{header:1});resolve(parseExcelData(jd,config));}catch(err){reject(err);}};r.onerror=reject;r.readAsArrayBuffer(file);});}

// DataReview - Excel読み込み + 形式切替 + 旧クラス内訳

    const handleTypeChange=(newAT,newPT)=>{setAT(newAT);setPT(newPT);if(students.length)setStudents(normalizeStudents(students,newAT,newPT));};

        <div className="flex items-center justify-between mb-6"><div><h2 className="text-3xl font-bold text-gray-800 mb-1">データ確認</h2><p className="text-gray-600">読み込んだデータを確認し、入力形式を設定してください</p></div><button onClick={onBack} className="px-4 py-2 text-blue-600 hover:bg-blue-50 rounded-lg">← 戻る</button></div>

        {students.length>0&&<div className="bg-white rounded-xl border border-gray-200 p-4 mb-6"><h3 className="font-medium text-gray-800 mb-3">生徒一覧（先頭20名）</h3><div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="border-b border-gray-200">{['氏名','性別','旧クラス','学力','運動','ピアノ','リーダー','特支','配慮Pt'].map(h=><th key={h} className="text-left py-2 px-3 font-medium text-gray-700">{h}</th>)}</tr></thead><tbody>{students.slice(0,20).map(s=><tr key={s.id} className="border-b border-gray-100 hover:bg-gray-50"><td className="py-2 px-3">{s.name}</td><td className="py-2 px-3"><span className={`px-2 py-0.5 rounded text-xs ${s.gender==='male'?'bg-blue-100 text-blue-700':'bg-pink-100 text-pink-700'}`}>{s.gender==='male'?'男':'女'}</span></td><td className="py-2 px-3">{s.currentClass}組</td><td className="py-2 px-3"><span className="px-2 py-0.5 bg-green-100 text-green-700 rounded text-xs font-medium">{(s.normalizedAcademic??50).toFixed(0)}</span></td><td className="py-2 px-3"><span className="px-2 py-0.5 bg-orange-100 text-orange-700 rounded text-xs font-medium">{(s.normalizedPhysical??50).toFixed(0)}</span></td><td className="py-2 px-3">{s.canPlayPiano?'○':''}</td><td className="py-2 px-3">{s.isLeader?'○':''}</td><td className="py-2 px-3">{s.hasSpecialSupport?'○':''}</td><td className="py-2 px-3">{(s.totalCarePoints??0)>0?<span className="px-2 py-0.5 bg-red-100 text-red-700 rounded text-xs font-medium">{s.totalCarePoints}pt</span>:'-'}</td></tr>)}</tbody></table></div>{students.length>20&&<div className="mt-3 text-center text-sm text-gray-500">他 {students.length-20}名（全{students.length}名）</div>}</div>}

    </div>);

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="space-y-6">
                <div className="bg-white rounded-xl border border-gray-200 p-6"><h3 className="font-bold text-gray-800 mb-4">クラス数設定</h3><div className="flex items-center gap-4"><span className="text-sm text-gray-600">新クラス数:</span><button onClick={()=>setNumClasses(Math.max(2,numClasses-1))} className="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full hover:bg-gray-200 font-bold">−</button><span className="text-2xl font-bold text-blue-600 w-12 text-center">{numClasses}</span><button onClick={()=>setNumClasses(Math.min(10,numClasses+1))} className="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full hover:bg-gray-200 font-bold">+</button><span className="text-sm text-gray-600">クラス</span></div><div className="text-sm text-gray-500 mt-2">1クラスあたり約{epc}名（全{students.length}名）</div></div>
                <div className="bg-white rounded-xl border border-gray-200 p-6"><h3 className="font-bold text-gray-800 mb-3">ペア制約の設定</h3><p className="text-sm text-gray-600 mb-4">同クラスにしたくない（NG）またはしたい（OK）生徒ペアを登録してください。</p>
                    <div className="grid grid-cols-2 gap-3 mb-3"><div><label className="text-xs text-gray-600 block mb-1">種類</label><select value={npType} onChange={e=>setNpType(e.target.value)} className="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-sm"><option value="ng">NGペア（同クラスにしない）</option><option value="ok">OKペア（同クラスにしたい）</option></select></div><div><label className="text-xs text-gray-600 block mb-1">優先度</label><select value={npPri} onChange={e=>setNpPri(e.target.value)} className="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-sm"><option value="required">必須</option><option value="preferred">できれば</option></select></div></div>
                    <div className="grid grid-cols-2 gap-3 mb-3"><div><label className="text-xs text-gray-600 block mb-1">生徒A</label><select value={npA} onChange={e=>setNpA(e.target.value)} className="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-sm"><option value="">-- 選択 --</option>{students.map(s=><option key={s.id} value={s.id}>{s.name}（{s.currentClass}組）</option>)}</select></div><div><label className="text-xs text-gray-600 block mb-1">生徒B</label><select value={npB} onChange={e=>setNpB(e.target.value)} className="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-sm"><option value="">-- 選択 --</option>{students.filter(s=>s.id!==npA).map(s=><option key={s.id} value={s.id}>{s.name}（{s.currentClass}組）</option>)}</select></div></div>
                    <button onClick={addConstraint} disabled={!npA||!npB||npA===npB} className="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-40 text-sm font-medium">ペアを追加</button>
                    {constraints.length>0&&<div className="mt-4 space-y-2">{constraints.map(c=><div key={c.id} className="flex items-center justify-between p-2 bg-gray-50 rounded-lg border border-gray-200"><div className="flex items-center gap-2 text-sm"><span className={`px-1.5 py-0.5 rounded text-xs font-bold text-white ${c.type==='ng'?'bg-red-500':'bg-green-500'}`}>{c.type==='ng'?'NG':'OK'}</span><span>{getName(c.studentA)}</span><span className="text-gray-400">↔</span><span>{getName(c.studentB)}</span><span className="text-xs text-gray-500 px-1.5 py-0.5 bg-gray-200 rounded">{c.priority==='required'?'必須':'できれば'}</span></div><button onClick={()=>removeConstraint(c.id)} className="text-gray-400 hover:text-red-500 text-lg">✕</button></div>)}</div>}
                </div>
            </div>
            <div className="bg-white rounded-xl border border-gray-200 p-6"><h3 className="font-bold text-gray-800 mb-3">最適化の優先度</h3><p className="text-sm text-gray-600 mb-4">値が大きいほど、その条件を優先して最適化します。</p><div className="max-h-[500px] overflow-y-auto pr-2">
                <WeightSlider label="クラス人数均等" value={weights.classSizeBalance} onChange={v=>setW('classSizeBalance',v)} description="各クラスの総人数をできるだけ揃える"/>
                <WeightSlider label="男女比均等" value={weights.genderBalance} onChange={v=>setW('genderBalance',v)} description="各クラスの男女比を均等にする"/>
                <WeightSlider label="学力均等" value={weights.academicBalance} onChange={v=>setW('academicBalance',v)} description="各クラスの学力平均を揃える"/>
                <WeightSlider label="運動能力均等" value={weights.physicalBalance} onChange={v=>setW('physicalBalance',v)} description="各クラスの運動能力平均を揃える"/>
                <WeightSlider label="ピアノ伴奏分散" value={weights.pianoDistribution} onChange={v=>setW('pianoDistribution',v)} description="各クラスにピアノ伴奏できる生徒を配置"/>
                <WeightSlider label="リーダー分散" value={weights.leaderDistribution} onChange={v=>setW('leaderDistribution',v)} description="各クラスにリーダー気質の生徒を配置"/>
                <WeightSlider label="配慮均等" value={weights.careBalance} onChange={v=>setW('careBalance',v)} description="配慮が必要な生徒を各クラスに均等配置"/>
                <WeightSlider label="特別支援均等" value={weights.specialSupportBalance} onChange={v=>setW('specialSupportBalance',v)} description="特別支援が必要な生徒を均等配置"/>
                <WeightSlider label="不登校分散" value={weights.absenceDistribution} onChange={v=>setW('absenceDistribution',v)} description="不登校傾向の生徒を分散配置"/>
                <WeightSlider label="旧クラス分散" value={weights.formerClassMix} onChange={v=>setW('formerClassMix',v)} description="旧クラスの人数比・男女比が偏らないよう配慮"/>
            </div></div>
        </div>
        <div className="mt-8 bg-gradient-to-r from-blue-600 to-blue-700 rounded-2xl p-8 text-white shadow-xl"><div className="text-center mb-4"><h3 className="text-2xl font-bold mb-2">AI最適化を開始</h3><p className="text-blue-100">遺伝的アルゴリズムにより上位5案を自動生成します</p></div><div className="flex justify-center gap-4 text-sm mb-6"><div className="bg-blue-500 px-3 py-1 rounded">個体数: {DEFAULT_GA_CONFIG.populationSize}</div><div className="bg-blue-500 px-3 py-1 rounded">世代数: {DEFAULT_GA_CONFIG.generations}</div><div className="bg-blue-500 px-3 py-1 rounded">生成案数: {DEFAULT_GA_CONFIG.numPlans}</div></div><div className="flex justify-center"><button onClick={()=>onStart(numClasses,weights,constraints)} className="px-8 py-4 bg-white text-blue-700 font-bold rounded-xl hover:bg-blue-50 transition-colors shadow-lg text-lg">最適化スタート →</button></div></div>
    </div>);
}

// Results - 統計ビュー + ドラッグ&ドロップ編集
function calcViolations(classes,constraints){return constraints.filter(c=>{const ca=classes.find(cl=>cl.students.some(s=>s.id===c.studentA))?.classNumber;const cb=classes.find(cl=>cl.students.some(s=>s.id===c.studentB))?.classNumber;if(ca===undefined||cb===undefined)return false;return c.type==='ng'?ca===cb:ca!==cb;});}
function calcPianoWarnings(classes){const w=new Set();classes.forEach(c=>{if(c.students.length&&!c.students.some(s=>s.canPlayPiano))w.add(c.classNumber);});return w;}

function Results({plans,constraints,allStudents,onBack,onSaveSession}){
    const[selIdx,setSelIdx]=useState(0);const[viewMode,setViewMode]=useState('stats');
    const[dragId,setDragId]=useState(null);const[dragFrom,setDragFrom]=useState(null);
    const[localPlans,setLocalPlans]=useState(plans);
    const[pianoWarnings,setPianoWarnings]=useState(new Set());const[dragViolations,setDragViolations]=useState([]);
    const[dropAlert,setDropAlert]=useState(null);const dropAlertTimer=useRef(null);
    const[saveMsg,setSaveMsg]=useState(null);
    const currentPlan=localPlans[selIdx];const violated=currentPlan?.violatedConstraints??[];

    useEffect(()=>{if(!currentPlan)return;setPianoWarnings(calcPianoWarnings(currentPlan.classes));setDragViolations(calcViolations(currentPlan.classes,constraints));},[selIdx,currentPlan,constraints]);

    const handleDragStart=useCallback((e,studentId,fromClass)=>{setDragId(studentId);setDragFrom(fromClass);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',studentId);},[]);
    const handleDragEnd=useCallback(()=>{setDragId(null);setDragFrom(null);},[]);
    const handleDrop=useCallback((e,toClass)=>{e.preventDefault();const studentId=e.dataTransfer.getData('text/plain')||dragId;if(!studentId||dragFrom===toClass)return;
        setLocalPlans(prev=>{const np=[...prev];const plan={...np[selIdx]};const nc=plan.classes.map(c=>({...c,students:[...c.students]}));
        const fromObj=nc.find(c=>c.classNumber===dragFrom);if(!fromObj)return prev;const si=fromObj.students.findIndex(s=>s.id===studentId);if(si===-1)return prev;const[moved]=fromObj.students.splice(si,1);
        const toObj=nc.find(c=>c.classNumber===toClass);if(!toObj)return prev;toObj.students.push(moved);
        plan.classes=nc;plan.stats=nc.map(c=>calcClassStats(c));np[selIdx]=plan;
        const newPW=calcPianoWarnings(nc);const newVio=calcViolations(nc,constraints);
        setPianoWarnings(newPW);setDragViolations(newVio);
        const msgs=[];
        if(newPW.size>0){Array.from(newPW).sort((a,b)=>a-b).forEach(n=>{const pc=nc.find(c=>c.classNumber===n)?.students.filter(s=>s.canPlayPiano).length??0;msgs.push({type:'piano',text:`🎹 ${n}組にピアノ奏者がいません（${pc}名）`});});}
        newVio.forEach(v=>{const nA=allStudents.find(s=>s.id===v.studentA)?.name??v.studentA;const nB=allStudents.find(s=>s.id===v.studentB)?.name??v.studentB;if(v.type==='ng')msgs.push({type:'ng',text:`🚫 ${nA} と ${nB} が同じクラスになっています（NG制約違反）`});else msgs.push({type:'ok',text:`⚠ ${nA} と ${nB} が別クラスになっています（OK制約違反）`});});
        const classSizes=nc.map(c=>c.students.length);const sizeMax=Math.max(...classSizes);const sizeMin=Math.min(...classSizes);
        if(sizeMax-sizeMin>=2){const maxC=nc.filter(c=>c.students.length===sizeMax).map(c=>`${c.classNumber}組`).join('・');const minC=nc.filter(c=>c.students.length===sizeMin).map(c=>`${c.classNumber}組`).join('・');msgs.push({type:'size',text:`👥 クラス人数の差が${sizeMax-sizeMin}名あります（最多: ${maxC}=${sizeMax}名 / 最少: ${minC}=${sizeMin}名）`});}
        const gd=nc.map(c=>({cn:c.classNumber,m:c.students.filter(s=>s.gender==='male').length,f:c.students.filter(s=>s.gender==='female').length}));
        const mMax=Math.max(...gd.map(c=>c.m));const mMin=Math.min(...gd.map(c=>c.m));
        const fMax=Math.max(...gd.map(c=>c.f));const fMin=Math.min(...gd.map(c=>c.f));
        if(mMax-mMin>=2){const hi=gd.filter(c=>c.m===mMax).map(c=>`${c.cn}組`).join('・');const lo=gd.filter(c=>c.m===mMin).map(c=>`${c.cn}組`).join('・');msgs.push({type:'gender',text:`♂ 男子の人数差が${mMax-mMin}名あります（最多: ${hi}=${mMax}名 / 最少: ${lo}=${mMin}名）`});}
        if(fMax-fMin>=2){const hi=gd.filter(c=>c.f===fMax).map(c=>`${c.cn}組`).join('・');const lo=gd.filter(c=>c.f===fMin).map(c=>`${c.cn}組`).join('・');msgs.push({type:'gender',text:`♀ 女子の人数差が${fMax-fMin}名あります（最多: ${hi}=${fMax}名 / 最少: ${lo}=${fMin}名）`});}
        if(msgs.length>0){setDropAlert(msgs);if(dropAlertTimer.current)clearTimeout(dropAlertTimer.current);dropAlertTimer.current=setTimeout(()=>setDropAlert(null),8000);}else{setDropAlert(null);if(dropAlertTimer.current)clearTimeout(dropAlertTimer.current);}
        return np;});
    },[dragId,dragFrom,selIdx,constraints,allStudents]);

    const handleExport=()=>exportToExcel(`クラス編成案${selIdx+1}`,currentPlan.classes);
    const handleSaveSession=useCallback(()=>{const data=onSaveSession?.(localPlans,selIdx);if(data){setSaveMsg('作業状態を保存しました。次回起動時に「再開する」から続行できます。');setTimeout(()=>setSaveMsg(null),5000);}else{setSaveMsg('保存に失敗しました');setTimeout(()=>setSaveMsg(null),3000);}},[onSaveSession,localPlans,selIdx]);
    const handleExportSessionJson=useCallback(()=>{const data=onSaveSession?.(localPlans,selIdx);if(data)exportSessionToFile(data);},[onSaveSession,localPlans,selIdx]);
    if(!currentPlan)return(<div className="max-w-7xl mx-auto px-6 py-8 text-center"><p className="text-gray-600 mb-4">編成案が見つかりませんでした。</p><button onClick={onBack} className="px-4 py-2 bg-blue-600 text-white rounded-lg">戻る</button></div>);

    const displayVio=viewMode==='drag'?dragViolations:violated;
    return(<div className="max-w-7xl mx-auto px-6 py-8">
        <div className="flex items-center justify-between mb-6"><div><h2 className="text-3xl font-bold text-gray-800 mb-1">結果確認</h2><p className="text-gray-600">AI最適化により{localPlans.length}案を生成しました。タブで比較し、ドラッグ&ドロップで微調整できます。</p></div><div className="flex gap-2 flex-wrap"><button onClick={onBack} className="px-4 py-2 text-blue-600 hover:bg-blue-50 rounded-lg">← 戻る</button><button onClick={handleSaveSession} className="px-4 py-2 bg-amber-500 text-white font-medium rounded-lg hover:bg-amber-600">💾 中断して保存</button><button onClick={handleExportSessionJson} className="px-4 py-2 bg-gray-600 text-white font-medium rounded-lg hover:bg-gray-700">📁 JSONで保存</button><button onClick={handleExport} className="px-4 py-2 bg-green-600 text-white font-medium rounded-lg hover:bg-green-700">📥 Excelで出力</button></div></div>
        {saveMsg&&<div className="mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm font-medium flex items-center gap-2"><span>✅</span><span>{saveMsg}</span></div>}
        <div className="flex gap-3 mb-4 overflow-x-auto pb-2">{localPlans.map((plan,i)=><button key={i} onClick={()=>setSelIdx(i)} className={`flex-shrink-0 flex flex-col items-center px-4 py-2.5 rounded-xl border-2 transition-all text-sm font-medium ${selIdx===i?'border-blue-600 bg-blue-600 text-white shadow-md':'border-gray-200 bg-white text-gray-700 hover:border-blue-300'}`}><span>案 {i+1}</span><span className="text-xs mt-1">スコア: {plan.score.toFixed(0)}</span>{plan.violatedConstraints.length>0&&<span className="text-xs mt-1 px-2 py-0.5 bg-red-500 text-white rounded">⚠{plan.violatedConstraints.length}</span>}</button>)}</div>
        {displayVio.length>0&&<div className="bg-red-50 border border-red-200 rounded-xl p-4 mb-4"><div className="font-bold text-red-700 mb-2">⚠ ペア制約の違反 {displayVio.length}件</div><div className="space-y-1 text-sm text-red-600">{displayVio.map((c,i)=>{const nA=allStudents.find(s=>s.id===c.studentA)?.name??c.studentA;const nB=allStudents.find(s=>s.id===c.studentB)?.name??c.studentB;return<div key={i}>{c.type==='ng'?'NG（同クラス禁止）':'OK（同クラス指定）'}: {nA} ↔ {nB}</div>;})}</div></div>}
        {viewMode==='drag'&&pianoWarnings.size>0&&<div className="bg-yellow-50 border border-yellow-200 rounded-xl p-4 mb-4"><div className="font-bold text-yellow-700 mb-1">🎹 ピアノ奏者がいないクラスがあります</div><div className="flex gap-2">{Array.from(pianoWarnings).sort((a,b)=>a-b).map(n=><span key={n} className="px-2 py-1 bg-red-100 text-red-700 rounded text-sm font-medium">{n}組：ピアノ 0名</span>)}</div></div>}
        <div className="flex gap-3 mb-4"><button onClick={()=>setViewMode('stats')} className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${viewMode==='stats'?'bg-blue-600 text-white':'bg-white border border-gray-300 text-gray-700 hover:bg-gray-50'}`}>統計ビュー</button><button onClick={()=>setViewMode('drag')} className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${viewMode==='drag'?'bg-blue-600 text-white':'bg-white border border-gray-300 text-gray-700 hover:bg-gray-50'}`}>ドラッグ&ドロップ編集</button></div>
        {viewMode==='stats'&&<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">{currentPlan.stats.map(s=><StatsCard key={s.classNumber} stats={s}/>)}</div>}
        {viewMode==='drag'&&<div>
            <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-4 text-sm text-blue-700">生徒カードをドラッグして別のクラス列にドロップすると移動できます。移動後にピアノ配置・NG/OK制約・クラス人数差・男女比の条件が満たされない場合、アラートが表示されます。</div>
            {dropAlert&&dropAlert.length>0&&<div className="fixed top-4 right-4 z-50 max-w-sm w-full alert-slide-in"><div className="bg-gradient-to-br from-red-600 to-red-700 text-white rounded-xl shadow-2xl overflow-hidden"><div className="flex items-center justify-between px-4 py-3 bg-red-800"><div className="flex items-center gap-2"><span className="text-xl alert-shake">⚠️</span><span className="font-bold text-base">条件違反が検出されました</span></div><button onClick={()=>{setDropAlert(null);if(dropAlertTimer.current)clearTimeout(dropAlertTimer.current);}} className="text-red-200 hover:text-white text-xl leading-none px-1">✕</button></div><div className="p-3 space-y-2">{dropAlert.map((msg,i)=><div key={i} className={`flex items-start gap-2 text-sm rounded-lg px-3 py-2 ${msg.type==='piano'?'bg-yellow-600':msg.type==='ng'?'bg-red-800':msg.type==='size'?'bg-indigo-600':msg.type==='gender'?'bg-blue-700':'bg-orange-600'}`}><span className="flex-1">{msg.text}</span></div>)}</div><div className="px-4 py-2 bg-red-800 text-xs text-red-200 text-center">ドラッグ&ドロップで修正してください（8秒後に自動で閉じます）</div></div></div>}
            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3">{currentPlan.classes.map(cls=><ClassColumn key={cls.classNumber} classData={cls} draggingStudentId={dragId} onDragStart={handleDragStart} onDragEnd={handleDragEnd} onDrop={handleDrop} hasPianoWarning={pianoWarnings.has(cls.classNumber)} violations={dragViolations} allStudents={allStudents}/>)}</div>
            <div className="mt-4 bg-white rounded-xl border border-gray-200 p-4"><h4 className="font-medium text-gray-800 mb-2">リアルタイム統計サマリー</h4><div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-2">{currentPlan.classes.map((cls,i)=>{const st=currentPlan.stats[i];const hw=pianoWarnings.has(cls.classNumber);return(<div key={cls.classNumber} className={`p-2 rounded-lg border text-sm ${hw?'border-red-300 bg-red-50':'border-gray-200 bg-gray-50'}`}><div className="font-bold" style={{color:CLASS_COLORS[(cls.classNumber-1)%CLASS_COLORS.length]}}>{cls.classNumber}組</div><div className="text-xs text-gray-600">{st?.total??0}名 | 学力{st?.avgAcademic??0} | 配慮{st?.totalCarePoints??0}pt</div>{hw&&<div className="text-xs text-red-600 font-medium">🎹 ピアノ 0名</div>}</div>);})}</div></div>
        </div>}
    </div>);
}

// Main App
function App(){
    const[currentStep,setCurrentStep]=useState(0);const[schoolType,setSchoolType]=useState(null);const[students,setStudents]=useState([]);
    const[academicInputType,setAcademicInputType]=useState('scale_5');const[physicalInputType,setPhysicalInputType]=useState('scale_5');
    const[showUpload,setShowUpload]=useState(false);const[plans,setPlans]=useState([]);const[constraints,setConstraints]=useState([]);
    const[isOptimizing,setIsOptimizing]=useState(false);const[optimizationProgress,setOptimizationProgress]=useState(0);const[optimizationError,setOptimizationError]=useState(null);
    const[isTransition,setIsTransition]=useState(false);const[sourceSchoolType,setSourceSchoolType]=useState(null);
    const[savedSession,setSavedSession]=useState(null);

    useEffect(()=>{const s=loadSessionFromStorage();if(s&&s.version)setSavedSession(s);},[]);

    const handleSaveSession=useCallback((currentPlans,selectedPlanIdx)=>{
        const data={version:1,savedAt:new Date().toISOString(),schoolType,students,academicInputType,physicalInputType,plans:currentPlans,constraints,isTransition,sourceSchoolType,selectedPlanIdx:selectedPlanIdx??0};
        if(saveSessionToStorage(data)){setSavedSession(data);return data;}return null;
    },[schoolType,students,academicInputType,physicalInputType,constraints,isTransition,sourceSchoolType]);

    const handleResumeSession=useCallback((session)=>{
        setSchoolType(session.schoolType);setStudents(session.students);setAcademicInputType(session.academicInputType);setPhysicalInputType(session.physicalInputType);
        setPlans(session.plans);setConstraints(session.constraints??[]);setIsTransition(session.isTransition??false);setSourceSchoolType(session.sourceSchoolType??null);
        setShowUpload(false);setCurrentStep(3);
    },[]);

    const handleImportSession=useCallback(async(file)=>{try{const data=await importSessionFromFile(file);if(data&&data.students&&data.plans){handleResumeSession(data);}else{alert('無効なセッションファイルです。');}}catch(e){console.error(e);alert('ファイルの読み込みに失敗しました。');}},[handleResumeSession]);

    const handleClearSession=useCallback(()=>{clearSessionStorage();setSavedSession(null);},[]);

    const handleResumeFromExcel=useCallback((importedStudents,at,pt)=>{
        const normalized=normalizeStudents(importedStudents,at,pt);
        const assignedNums=[...new Set(normalized.map(s=>s.assignedClass).filter(Boolean))].sort((a,b)=>a-b);
        if(!assignedNums.length)return;
        const classes=assignedNums.map(cn=>({classNumber:cn,students:normalized.filter(s=>s.assignedClass===cn)}));
        const unassigned=normalized.filter(s=>!s.assignedClass);
        if(unassigned.length&&classes.length)classes[0].students.push(...unassigned);
        const stats=classes.map(c=>calcClassStats(c));
        const plan={id:'plan_restored',score:0,classes,stats,violatedConstraints:[],generatedAt:new Date()};
        setStudents(normalized);setAcademicInputType(at);setPhysicalInputType(pt);
        setPlans([plan]);setConstraints([]);setShowUpload(false);setCurrentStep(3);
    },[]);

    const handleSchoolSelect=useCallback((type,useSample,options)=>{
        const srcType=options?.sourceSchoolType??type;const srcPreset=SCHOOL_PRESETS[srcType];
        setSchoolType(type);setIsTransition(options?.isTransition??false);setSourceSchoolType(options?.sourceSchoolType??null);
        setAcademicInputType(srcPreset.defaultAcademicInput);setPhysicalInputType(srcPreset.defaultPhysicalInput);setShowUpload(!useSample);
        if(useSample){const ss=generateSampleStudents(srcType);setStudents(normalizeStudents(ss,srcPreset.defaultAcademicInput,srcPreset.defaultPhysicalInput));}else{setStudents([]);}
        setCurrentStep(1);
    },[]);
    const handleDataConfirm=useCallback((cs,at,pt)=>{setStudents(cs);setAcademicInputType(at);setPhysicalInputType(pt);setCurrentStep(2);},[]);
    const handleOptimizationStart=useCallback(async(nc,w,c)=>{if(!schoolType)return;setConstraints(c);setIsOptimizing(true);setOptimizationError(null);setOptimizationProgress(0);try{const cfg={numClasses:nc,schoolType,weights:w,constraints:c,...DEFAULT_GA_CONFIG};const gp=await optimizeClassAssignment(students,cfg,p=>setOptimizationProgress(Math.round(p*100)));setPlans(gp);setCurrentStep(3);}catch(e){console.error(e);setOptimizationError('最適化中にエラーが発生しました。再度お試しください。');}finally{setIsOptimizing(false);}},[schoolType,students]);
    const preset=schoolType?SCHOOL_PRESETS[schoolType]:null;
    return(<div className="min-h-screen bg-gray-50">
        <Header currentStep={currentStep}/>
        {isOptimizing&&<div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"><div className="bg-white rounded-2xl p-8 max-w-md w-full mx-4 shadow-2xl"><div className="text-center"><div className="text-6xl mb-4">🤖</div><h3 className="text-2xl font-bold text-gray-800 mb-2">AI最適化中...</h3><p className="text-gray-600 mb-6">遺伝的アルゴリズムによりクラス編成を最適化しています</p><div className="w-full bg-gray-200 rounded-full h-4 mb-2 overflow-hidden"><div className="bg-blue-600 h-full transition-all duration-300 rounded-full" style={{width:`${optimizationProgress}%`}}></div></div><div className="text-3xl font-bold text-blue-600">{optimizationProgress}%</div></div></div></div>}
        {optimizationError&&<div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"><div className="bg-white rounded-2xl p-8 max-w-md w-full mx-4 shadow-2xl"><div className="text-center"><div className="text-6xl mb-4">⚠️</div><h3 className="text-2xl font-bold text-red-600 mb-2">エラー</h3><p className="text-gray-700 mb-6">{optimizationError}</p><button onClick={()=>setOptimizationError(null)} className="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700">再設定する</button></div></div></div>}
        {currentStep===0&&<SchoolSelect onSelect={handleSchoolSelect} savedSession={savedSession} onResumeSession={handleResumeSession} onImportSession={handleImportSession} onClearSession={handleClearSession}/>}
        {currentStep===1&&schoolType&&<DataReview students={students} schoolType={schoolType} academicInputType={academicInputType} physicalInputType={physicalInputType} onNext={handleDataConfirm} onBack={()=>setCurrentStep(0)} showUpload={showUpload} onResumeFromExcel={handleResumeFromExcel}/>}
        {currentStep===2&&schoolType&&preset&&<Conditions students={students} schoolType={schoolType} defaultWeights={preset.defaultWeights} defaultNumClasses={preset.defaultNumClasses} isTransition={isTransition} sourceSchoolType={sourceSchoolType} onStart={handleOptimizationStart} onBack={()=>setCurrentStep(1)}/>}
        {currentStep===3&&plans.length>0&&<Results plans={plans} constraints={constraints} allStudents={students} onBack={()=>setCurrentStep(2)} onSaveSession={handleSaveSession}/>}
        <footer className="bg-gray-800 text-gray-300 py-4 mt-12"><div className="max-w-7xl mx-auto px-6 text-center text-sm">AIクラス編成アシスタント v1.0 | 完全オフライン動作 | 文科省情報セキュリティガイドライン準拠</div></footer>
    </div>);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
